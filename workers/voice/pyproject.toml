[project]
name = "vp-worker-voice"
version = "0.0.0"
description = "Pipecat call workers: build the pipeline from agent config at call start."
requires-python = ">=3.12,<3.13"
dependencies = ["vp-shared", "vp-db"]

[tool.uv.sources]
vp-shared = { workspace = true }
vp-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
