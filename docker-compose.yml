# Local dev infra only. Not used in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vp
      POSTGRES_PASSWORD: vp_local_dev
      POSTGRES_DB: vp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vp"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
