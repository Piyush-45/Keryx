[project]
name = "voice-platform"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "api",
    "workers/voice",
    "workers/postcall",
    "workers/campaigns",
    "packages/shared/python",
    "packages/db",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "datamodel-code-generator>=0.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/generated/**", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "postcall", "campaigns", "vp_shared", "vp_db"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN"]
"api/migrations/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "generated/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "api/tests",
    "workers/voice/tests",
    "workers/postcall/tests",
    "workers/campaigns/tests",
    "packages/shared/python/tests",
    "packages/db/tests",
]
addopts = "--import-mode=importlib"

# `make codegen` — Pydantic models generated from packages/shared/agent_config.schema.json.
[tool.datamodel-codegen]
input = "packages/shared/agent_config.schema.json"
input-file-type = "jsonschema"
output = "packages/shared/python/vp_shared/generated/agent_config.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
disable-timestamp = true
use-schema-description = true
use-double-quotes = true
collapse-root-models = true
enum-field-as-literal = "all"
use-default = true
strict-nullable = true
use-title-as-name = true
formatters = ["ruff-check", "ruff-format"]
custom-file-header = "# Generated by `make codegen` from packages/shared/agent_config.schema.json. Do not edit."
