[project]
name = "vp-db"
version = "0.0.0"
description = "Database models, tenant-scoped sessions and RLS helpers shared by the API and workers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# vp_db.testing (pytest plugin) needs these; only loaded by the test suites.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "alembic>=1.13", "pydantic-settings>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vp_db"]
