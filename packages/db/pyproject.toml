[project]
name = "vp-db"
version = "0.0.0"
description = "Database models, tenant-scoped sessions and RLS helpers shared by the API and workers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vp_db"]
