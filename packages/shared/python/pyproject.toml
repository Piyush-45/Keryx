[project]
name = "vp-shared"
version = "0.0.0"
description = "Shared schemas (agent config, event types) for Python services."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vp_shared"]
