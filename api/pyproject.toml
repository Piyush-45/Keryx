[project]
name = "vp-api"
version = "0.0.0"
description = "Control-plane API: tenants, agents, campaigns, calls, integrations, webhooks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "vp-shared",
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
vp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
